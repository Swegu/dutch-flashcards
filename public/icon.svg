<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#e05200"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- App Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Back Flashcard -->
  <g transform="rotate(-8 64 64)" filter="url(#shadow)">
    <rect x="26" y="24" width="72" height="82" rx="12" fill="#fff" opacity="0.85"/>
  </g>
  <!-- Front Flashcard -->
  <g transform="rotate(4 64 64)" filter="url(#shadow)">
    <rect x="28" y="22" width="74" height="84" rx="12" fill="#ffffff"/>
    <!-- Dutch Flag Top Strip -->
    <path d="M40 22 h50 a12 12 0 0 1 12 12 v2 H28 v-2 a12 12 0 0 1 12 -12 z" fill="#ae1c28"/>
    <rect x="28" y="36" width="74" height="5" fill="#ffffff"/>
    <rect x="28" y="41" width="74" height="5" fill="#21468b"/>
    <!-- Dutch Tulip + W Emblem -->
    <path d="M65 54 c-5 5 -7 12 -7 18 c0 8 6 14 14 14 s14 -6 14 -14 c0 -6 -2 -13 -7 -18 c-2 4 -4 6 -7 6 s-5 -2 -7 -6 z" fill="#ff6a00" transform="translate(-7, 0)"/>
    <path d="M51 58 c3 7 8 11 14 11 c6 0 11 -4 14 -11 c1 4 1 10 -2 15 c-3 5 -7 7 -12 7 s-9 -2 -12 -7 c-3 -5 -3 -11 -2 -15 z" fill="#e05200" opacity="0.35"/>
    <!-- Word lines -->
    <rect x="44" y="92" width="42" height="5" rx="2.5" fill="#1d2433" opacity="0.8"/>
  </g>
</svg>

